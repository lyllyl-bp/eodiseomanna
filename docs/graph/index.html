    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  initialStateElement?.remove();

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      typeof nextState !== &quot;object&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    globalThis.dispatchEvent(

      }),

  };

    postToHost(&quot;height&quot;, {

        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

quot;toLineId&quot;:&quot;GC&quot;,&quot;walkMinutes&quot;:3.5},{&quot;stationId&quot;:&quot;청량리&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;SB&quot;,&quot;walkMinutes&quot;:3.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;4&quot;,&quot;toLineId&quot;:&quot;SB&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;4&quot;,&quot;toLineId&quot;:&quot;SH&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;SB&quot;,&quot;toLineId&quot;:&quot;4&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;SB&quot;,&quot;toLineId&quot;:&quot;SH&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;SH&quot;,&quot;toLineId&quot;:&quot;4&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;초지&quot;,&quot;fromLineId&quot;:&quot;SH&quot;,&quot;toLineId&quot;:&quot;SB&quot;,&quot;walkMinutes&quot;:7.5},{&quot;stationId&quot;:&quot;충무로&quot;,&quot;fromLineId&quot;:&quot;3&quot;,&quot;toLineId&quot;:&quot;4&quot;,&quot;walkMinutes&quot;:1.0},{&quot;stationId&quot;:&quot;충무로&quot;,&quot;fromLineId&quot;:&quot;4&quot;,&quot;toLineId&quot;:&quot;3&quot;,&quot;walkMinutes&quot;:1.0},{&quot;stationId&quot;:&quot;충정로&quot;,&quot;fromLineId&quot;:&quot;2&quot;,&quot;toLineId&quot;:&quot;5&quot;,&quot;walkMinutes&quot;:7.0},{&quot;stationId&quot;:&quot;충정로&quot;,&quot;fromLineId&quot;:&quot;5&quot;,&quot;toLineId&quot;:&quot;2&quot;,&quot;walkMinutes&quot;:7.0},{&quot;stationId&quot;:&quot;태릉입구&quot;,&quot;fromLineId&quot;:&quot;6&quot;,&quot;toLineId&quot;:&quot;7&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;태릉입구&quot;,&quot;fromLineId&quot;:&quot;7&quot;,&quot;toLineId&quot;:&quot;6&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;한대앞&quot;,&quot;fromLineId&quot;:&quot;4&quot;,&quot;toLineId&quot;:&quot;SB&quot;,&quot;walkMinutes&quot;:0.5},{&quot;stationId&quot;:&quot;한대앞&quot;,&quot;fromLineId&quot;:&quot;SB&quot;,&quot;toLineId&quot;:&quot;4&quot;,&quot;walkMinutes&quot;:0.5},{&quot;stationId&quot;:&quot;합정&quot;,&quot;fromLineId&quot;:&quot;2&quot;,&quot;toLineId&quot;:&quot;6&quot;,&quot;walkMinutes&quot;:2.5},{&quot;stationId&quot;:&quot;합정&quot;,&quot;fromLineId&quot;:&quot;6&quot;,&quot;toLineId&quot;:&quot;2&quot;,&quot;walkMinutes&quot;:2.5},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;2&quot;,&quot;toLineId&quot;:&quot;AR&quot;,&quot;walkMinutes&quot;:8.5},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;2&quot;,&quot;toLineId&quot;:&quot;GJ&quot;,&quot;walkMinutes&quot;:8.5},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;AR&quot;,&quot;toLineId&quot;:&quot;2&quot;,&quot;walkMinutes&quot;:8.5},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;AR&quot;,&quot;toLineId&quot;:&quot;GJ&quot;,&quot;walkMinutes&quot;:8.5},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;2&quot;,&quot;walkMinutes&quot;:6.0},{&quot;stationId&quot;:&quot;홍대입구&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;AR&quot;,&quot;walkMinutes&quot;:6.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;1&quot;,&quot;toLineId&quot;:&quot;GC&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;1&quot;,&quot;toLineId&quot;:&quot;GJ&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;GC&quot;,&quot;toLineId&quot;:&quot;1&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;GC&quot;,&quot;toLineId&quot;:&quot;GJ&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;1&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;회기&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;GC&quot;,&quot;walkMinutes&quot;:2.0},{&quot;stationId&quot;:&quot;효창공원앞&quot;,&quot;fromLineId&quot;:&quot;6&quot;,&quot;toLineId&quot;:&quot;GJ&quot;,&quot;walkMinutes&quot;:5.0},{&quot;stationId&quot;:&quot;효창공원앞&quot;,&quot;fromLineId&quot;:&quot;GJ&quot;,&quot;toLineId&quot;:&quot;6&quot;,&quot;walkMinutes&quot;:5.0}]}&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;eodiseomanna-transit-network&#x27;);
      const dataElement = document.getElementById(&#x27;network-data&#x27;);
      if (typeof d3 === &#x27;undefined&#x27;) {
        root.querySelector(&#x27;#network-selection&#x27;).textContent = &#x27;그래프를 불러오지 못했습니다. 인터넷 연결을 확인한 후 새로고침해 주세요.&#x27;;
        return;
      }
      const data = JSON.parse(dataElement.textContent);
      const lineById = new Map(data.lines.map((line, index) =&gt; [line.id, { ...line, index }]));
      const stationMap = new Map();

      const ensureStation = (name) =&gt; {
        if (!stationMap.has(name)) {
          stationMap.set(name, {
            id: name,
            lines: new Set(),
            neighbors: new Set(),
            rideMinutes: [],
            transferMinutes: []
          });
        }
        return stationMap.get(name);
      };

      data.rideEdges.forEach((edge) =&gt; {
        const from = ensureStation(edge.from);
        const to = ensureStation(edge.to);
        from.lines.add(edge.lineId);
        to.lines.add(edge.lineId);
        from.neighbors.add(edge.to);
        to.neighbors.add(edge.from);
        from.rideMinutes.push(edge.minutes);
        to.rideMinutes.push(edge.minutes);
      });

      data.transfers.forEach((transfer) =&gt; {
        const station = ensureStation(transfer.stationId);
        station.lines.add(transfer.fromLineId);
        station.lines.add(transfer.toLineId);
        station.transferMinutes.push(transfer.walkMinutes);
      });

      const nodes = [...stationMap.values()].map((station) =&gt; ({
        ...station,
        lines: [...station.lines].sort((a, b) =&gt; lineById.get(a).index - lineById.get(b).index),
        neighbors: [...station.neighbors].sort(),
        rideMinutes: [...station.rideMinutes],
        transferMinutes: [...station.transferMinutes]
      }));

      const links = data.rideEdges.map((edge) =&gt; ({ ...edge, source: edge.from, target: edge.to }));
      const svg = d3.select(root.querySelector(&#x27;#network-svg&#x27;));
      const viewport = d3.select(root.querySelector(&#x27;#network-viewport&#x27;));
      const hitLayer = d3.select(root.querySelector(&#x27;#network-link-hits&#x27;));
      const linkLayer = d3.select(root.querySelector(&#x27;#network-links&#x27;));
      const nodeLayer = d3.select(root.querySelector(&#x27;#network-nodes&#x27;));
      const timeLabelLayer = d3.select(root.querySelector(&#x27;#network-time-labels&#x27;));
      const labelLayer = d3.select(root.querySelector(&#x27;#network-labels&#x27;));
      const plot = root.querySelector(&#x27;#network-plot&#x27;);
      const selection = root.querySelector(&#x27;#network-selection&#x27;);
      const counts = root.querySelector(&#x27;#network-counts&#x27;);
      const legend = root.querySelector(&#x27;#network-legend&#x27;);
      const savedState = window.openai?.widgetState?.privateContent || {};
      let selectedId = typeof savedState.selectedStation === &#x27;string&#x27; ? savedState.selectedStation : null;
      let width = Math.max(320, plot.clientWidth);
      let height = width &lt;= 520 ? 500 : 620;

      counts.textContent = `${data.lines.length}개 노선 · ${nodes.length}개 역 · ${links.length}개 이동 간선 · ${data.transfers.length}개 환승 간선`;

      data.lines.forEach((line) =&gt; {
        const item = document.createElement(&#x27;span&#x27;);
        item.className = &#x27;network-legend-item&#x27;;
        item.innerHTML = `&lt;span class=&quot;network-swatch&quot; style=&quot;--line-color:${line.color}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;${line.label}&lt;/span&gt;`;
        legend.appendChild(item);
      });

      const nodeRadius = (node) =&gt; 2.4 + Math.min(node.lines.length, 4) * 1.35;
      const nodeColor = (node) =&gt; lineById.get(node.lines[0])?.color || &#x27;var(--viz-series-1)&#x27;;
      const lineNames = (node) =&gt; node.lines.map((id) =&gt; lineById.get(id)?.label || id).join(&#x27;, &#x27;);
      const formatMinutes = (value) =&gt; Number(value).toFixed(1).replace(&#x27;.0&#x27;, &#x27;&#x27;);
      const minuteRange = (values) =&gt; {
        if (!values.length) return null;
        const minimum = Math.min(...values);
        const maximum = Math.max(...values);
        return minimum === maximum ? formatMinutes(minimum) : `${formatMinutes(minimum)}~${formatMinutes(maximum)}`;
      };

      const updateSelection = () =&gt; {
        const node = nodes.find((candidate) =&gt; candidate.id === selectedId);
        if (!node) {
          selection.innerHTML = &#x27;&lt;strong&gt;역을 선택해 연결 정보를 확인하세요.&lt;/strong&gt;&lt;span&gt; 노드가 클수록 여러 노선이 만나는 환승역입니다.&lt;/span&gt;&#x27;;
          return;
        }
        const ride = minuteRange(node.rideMinutes);
        const walk = minuteRange(node.transferMinutes);
        const rideText = ride ? ` · 운행 ${ride}분` : &#x27;&#x27;;
        const walkText = walk ? ` · 환승 보행 ${walk}분` : &#x27;&#x27;;
        selection.innerHTML = `&lt;strong&gt;${node.id}역&lt;/strong&gt;&lt;span&gt; · ${lineNames(node)} · 인접 ${node.neighbors.length}개 역${rideText}${walkText}&lt;/span&gt;`;
      };

      const linkHit = hitLayer.selectAll(&#x27;line&#x27;)
        .data(links)
        .join(&#x27;line&#x27;)
        .attr(&#x27;class&#x27;, &#x27;network-link-hit cursor-interaction&#x27;)
        .attr(&#x27;data-tooltip&#x27;, (edge) =&gt; `${edge.from}역 ↔ ${edge.to}역 · ${lineById.get(edge.lineId)?.label || edge.lineId} · ${formatMinutes(edge.minutes)}분`);

      const link = linkLayer.selectAll(&#x27;line&#x27;)
        .data(links)
        .join(&#x27;line&#x27;)
        .attr(&#x27;class&#x27;, &#x27;network-link&#x27;)
        .attr(&#x27;stroke&#x27;, (edge) =&gt; lineById.get(edge.lineId)?.color || &#x27;var(--border)&#x27;)
        .attr(&#x27;stroke-width&#x27;, (edge) =&gt; Math.min(4, 0.8 + edge.minutes * 0.32));

      const node = nodeLayer.selectAll(&#x27;circle&#x27;)
        .data(nodes)
        .join(&#x27;circle&#x27;)
        .attr(&#x27;class&#x27;, (station) =&gt; `network-node cursor-interaction${station.lines.length &gt; 1 ? &#x27; is-transfer&#x27; : &#x27;&#x27;}${station.id === selectedId ? &#x27; is-selected&#x27; : &#x27;&#x27;}`)
        .attr(&#x27;r&#x27;, nodeRadius)
        .attr(&#x27;fill&#x27;, nodeColor)
        .attr(&#x27;aria-label&#x27;, (station) =&gt; `${station.id}역, ${lineNames(station)}`)
        .attr(&#x27;data-tooltip&#x27;, (station) =&gt; `${station.id}역 · ${lineNames(station)}`)
        .on(&#x27;click&#x27;, (event, station) =&gt; {
          event.stopPropagation();
          selectedId = station.id;
          node.classed(&#x27;is-selected&#x27;, (candidate) =&gt; candidate.id === selectedId);
          labels.attr(&#x27;display&#x27;, (candidate) =&gt; candidate.lines.length &gt;= 3 || candidate.id === selectedId ? null : &#x27;none&#x27;);
          updateEdgeFocus();
          renderPositions();
          updateSelection();
          window.openai?.setWidgetState?.({
            modelContent: { selectedStation: station.id, lines: station.lines },
            privateContent: { selectedStation: station.id }
          }).catch(() =&gt; {});
        });

      const labels = labelLayer.selectAll(&#x27;text&#x27;)
        .data(nodes)
        .join(&#x27;text&#x27;)
        .attr(&#x27;class&#x27;, &#x27;network-label&#x27;)
        .attr(&#x27;display&#x27;, (station) =&gt; station.lines.length &gt;= 3 || station.id === selectedId ? null : &#x27;none&#x27;)
        .attr(&#x27;dx&#x27;, (station) =&gt; nodeRadius(station) + 4)
        .attr(&#x27;dy&#x27;, 4)
        .text((station) =&gt; station.id);

      let timeLabels = timeLabelLayer.selectAll(&#x27;text&#x27;);
      const endpointId = (endpoint) =&gt; typeof endpoint === &#x27;string&#x27; ? endpoint : endpoint.id;
      const isIncident = (edge) =&gt; endpointId(edge.source) === selectedId || endpointId(edge.target) === selectedId;
      const updateEdgeFocus = () =&gt; {
        link
          .classed(&#x27;is-related&#x27;, (edge) =&gt; Boolean(selectedId) &amp;&amp; isIncident(edge))
          .classed(&#x27;is-dimmed&#x27;, (edge) =&gt; Boolean(selectedId) &amp;&amp; !isIncident(edge));
        const incident = selectedId ? links.filter(isIncident) : [];
        timeLabels = timeLabelLayer.selectAll(&#x27;text&#x27;)
          .data(incident, (edge) =&gt; `${edge.lineId}:${edge.from}:${edge.to}`)
          .join(&#x27;text&#x27;)
          .attr(&#x27;class&#x27;, &#x27;network-time-label tabular-nums&#x27;)
          .text((edge) =&gt; `${formatMinutes(edge.minutes)}분`);
      };

      updateEdgeFocus();

      svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);

      const zoom = d3.zoom()
        .scaleExtent([0.45, 5])
        .on(&#x27;zoom&#x27;, (event) =&gt; viewport.attr(&#x27;transform&#x27;, event.transform));
      svg.call(zoom);
      svg.on(&#x27;dblclick.zoom&#x27;, null);
      svg.on(&#x27;click&#x27;, (event) =&gt; {
        if (event.defaultPrevented) return;
        selectedId = null;
        node.classed(&#x27;is-selected&#x27;, false);
        labels.attr(&#x27;display&#x27;, (candidate) =&gt; candidate.lines.length &gt;= 3 ? null : &#x27;none&#x27;);
        updateEdgeFocus();
        renderPositions();
        updateSelection();
        window.openai?.setWidgetState?.({
          modelContent: null,
          privateContent: { selectedStation: null }
        }).catch(() =&gt; {});
      });

      const renderPositions = () =&gt; {
        link
          .attr(&#x27;x1&#x27;, (edge) =&gt; edge.source.x)
          .attr(&#x27;y1&#x27;, (edge) =&gt; edge.source.y)
          .attr(&#x27;x2&#x27;, (edge) =&gt; edge.target.x)
          .attr(&#x27;y2&#x27;, (edge) =&gt; edge.target.y);
        linkHit
          .attr(&#x27;x1&#x27;, (edge) =&gt; edge.source.x)
          .attr(&#x27;y1&#x27;, (edge) =&gt; edge.source.y)
          .attr(&#x27;x2&#x27;, (edge) =&gt; edge.target.x)
          .attr(&#x27;y2&#x27;, (edge) =&gt; edge.target.y);
        node.attr(&#x27;cx&#x27;, (station) =&gt; station.x).attr(&#x27;cy&#x27;, (station) =&gt; station.y);
        labels.attr(&#x27;x&#x27;, (station) =&gt; station.x).attr(&#x27;y&#x27;, (station) =&gt; station.y);
        timeLabels
          .attr(&#x27;x&#x27;, (edge) =&gt; (edge.source.x + edge.target.x) / 2)
          .attr(&#x27;y&#x27;, (edge) =&gt; (edge.source.y + edge.target.y) / 2 - 5);
      };

      const fitGraph = () =&gt; {
        const xExtent = d3.extent(nodes, (station) =&gt; station.x);
        const yExtent = d3.extent(nodes, (station) =&gt; station.y);
        const graphWidth = Math.max(1, xExtent[1] - xExtent[0]);
        const graphHeight = Math.max(1, yExtent[1] - yExtent[0]);

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const hoverDelay = 700;
  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
